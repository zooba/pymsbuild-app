name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install --pre pymsbuild -r tests/requirements.txt
    - name: Test with pytest
      run: |
        python -m pymsbuild -h
        pytest
      env:
        PYMSBUILD_EXTENSION_COMMAND: 'app=pymsbuild_app:build'
    - name: Check self build (sdist)
      run: python -m pymsbuild sdist
    - name: Check self build (wheel)
      run: python -m pymsbuild wheel
